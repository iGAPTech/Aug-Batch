<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            background-color: bisque;
        }
        span{
            font-size: 30px;
        }


        #center{
            position: absolute;
            left:45%;
            top:45%
        }
        #top{
            position: absolute;
            left:45%;
            top:0
        }
        #right{
            position: absolute;
            right:5%;
            top:45%
        }
        #bottom{
            position: absolute;
            bottom:0;
            left:45%
        }
        #left{
            position: absolute;
            left: 5%;
            top:45%
        }

        #leftTop{
            position: absolute;
            left:5%;
            top:0;
        }
        #rightTop{
            position: absolute;
            right:5%;
            top:0;
        }
        #rightBottom{
            position: absolute;
            right:5%;
            bottom: 0;
        }
        #leftBottom{
            position: absolute;
            left:5%;
            bottom: 0;
        }

        span:hover{
            font-size: 34px;
            color: red;
        }
    </style>
</head>
<body>
    <span id="center">Center</span>
    <span id="top">Top</span>
    <span id="right">Right</span>
    <span id="bottom">Bottom</span>
    <span id="left">Left</span>

    <span id="leftTop">Left-Top</span>
    <span id="rightTop">Right-Top</span>
    <span id="rightBottom">Right-Bottom</span>
    <span id="leftBottom">Left-Bottom</span>

</body>
</html>

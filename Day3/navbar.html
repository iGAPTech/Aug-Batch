<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section{
            min-height:700px
        }
        #home{
            background-color: bisque;
        }
        #about{
            background-color: yellowgreen;
        }
        #services{
            background-color: aquamarine;
        }
        #contact{
            background-color: thistle;
        }
        h1{
            text-align: center;
            margin: 0;
            padding-top: 120px;
        }
        .menu{
            text-align: center;
            margin: -5px;
            background-color: turquoise;
            padding: 40px;
            position: sticky;
            top:0;
        }
        .menu a{
            
            color: rgb(96, 1, 1);
            margin: 5px;            
            font-size: 22px;
            text-decoration: none;
        }
        .menu a:hover{
            
            /* font-size: 25px; */
            color: red;
            background-color: bisque;
            border: 1px solid red;
            padding: 5px;
            border-radius: 10px;

        }

        .whatsapp-btn{
            position: fixed;
            right: 5%;
            bottom: 5%;
        }

        p{
            position: sticky;
            top:0;
        }
    </style>
</head>
<body>

    <div class="menu">
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#services">Services</a>
            <a href="#contact">Contact</a>
    </div>
    
    <section id="home">
        <h1>Home Section</h1>
        <img src="../assets/img/demo.png" alt="" width="100%">
        
    </section>

    <section id="about">
        <h1>About Section</h1>
        
    </section>

    
    <section id="services">
        <h1>Services Section</h1>
        
    </section>

    <section id="contact">
        <h1>Contact Section</h1>
        
    </section>
    <img src="/assets/img/whatsapp.png" alt="Whatsapp Icon" class="whatsapp-btn">
    

    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

</head>
<body>

    <h1>.badge</h1>
    <div class="container mt-4 mb-5">
        <span class="badge bg-danger">234</span> <br><br>

        <button class="btn btn-primary"> Messages <span class="badge bg-danger rounded-circle">12</span></button>
        <br><br>


        <span class="badge bg-success rounded-circle">Messages</span>

        <hr>

        <h1>.progress .progress-bar</h1>
        <br><br>

        <div class="progress" style="height: 40px;">
            <div class="progress-bar" style="width:80%">
            </div>
        </div>

        <br><br>
        <div class="progress" style="height: 40px;">
            <div class="progress-bar bg-success" style="width:55%">
                55%
            </div>
        </div>
        <br><br>
        <div class="progress" style="height: 30px;">
            <div class="progress-bar bg-danger" style="width:55%">
                55%
            </div>
        </div>

        <br><br>
        <div class="progress" style="height: 30px;">
            <div class="progress-bar bg-danger progress-bar-striped" style="width:75%">
                75%
            </div>
        </div>
        <br><br>
        <div class="progress" style="height: 30px;">
            <div class="progress-bar bg-danger progress-bar-striped progress-bar-animated" style="width:75%">
                75%
            </div>
        </div>

        <br><br>


        <div class="progress">
            <div class="progress-bar" style="width:60%">Free Space</div>

            <div class="progress-bar bg-warning" style="width:20%">warning </div>
            <div class="progress-bar bg-danger" style="width:20%">Danger</div>
        </div>
    </div>  
</body>
</html>

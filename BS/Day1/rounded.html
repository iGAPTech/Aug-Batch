<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        span{
            display: inline-block;
            width: 150px;
            height: 150px;
            margin: 20px;
            background-color: #111010;
           
        }
    </style>
</head>
<body>
    <span class="rounded-5"></span>
    <span class="rounded-top"></span>
    <span class="rounded-end"></span>
    <span class="rounded-bottom"></span>
    <span class="rounded-start"></span>
    <span class="rounded-circle"></span>
    <span class="rounded-pill" style="width:300px"></span>


    <hr>

    <h1>Shadow</h1>
    <hr>

    <div class="shadow-none p-4 mb-4 text-bg-primary mx-5">No shadow</div>

    <div class="shadow p-4 mb-4 text-bg-light mx-5">Default shadow</div>

    <div class="shadow-sm p-4 mb-4 text-bg-light mx-5">small shadow</div>
    <div class="shadow-lg p-4 mb-4 text-bg-light mx-5">large shadow</div>


    
</body>
</html>
